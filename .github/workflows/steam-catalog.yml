name: Catalog Steam

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "ID-ul unei rulări anterioare pentru reluare (opțional)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: steam-catalog
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalează dependența Excel
        run: python -m pip install openpyxl==3.1.5
      - name: Recuperează progresul anterior
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: steam-catalog
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: output
      - name: Colectează catalogul
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          mkdir -p output
          status=0
          timeout --preserve-status --signal=INT --kill-after=120s 325m \
            python -u steam_catalog.py --fast --since 2024-01-01 \
            --db output/steam_progress.sqlite3 --output output/steam_games.xlsx || status=$?
          if [ "$status" -eq 130 ]; then
            echo "Colectare întreruptă. Descarcă progresul sau reia cu ID-ul acestei rulări." >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$status"
          fi
      - name: Salvează Excelul și progresul
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-catalog
          path: |
            output/steam_games.xlsx
            output/steam_progress.sqlite3
          if-no-files-found: warn
          retention-days: 14
