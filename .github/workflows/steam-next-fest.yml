name: Steam Next Fest — October 2026

on:
  push:
    branches: [codex/run-steam-next-fest-october-2026]
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "ID-ul unei rulări anterioare pentru reluare (opțional)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: steam-next-fest-october-2026
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalează dependența Excel
        run: python -m pip install openpyxl==3.1.5
      - name: Recuperează progresul anterior
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: steam-next-fest-october-2026
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: output
      - name: Colectează datele pentru Next Fest
        run: |
          mkdir -p output
          status=0
          timeout --preserve-status --signal=INT --kill-after=120s 325m \
            python -u steam_next_fest.py --db output/steam_next_fest.sqlite3 \
            --output output/steam_next_fest.xlsx || status=$?
          if [ "$status" -eq 130 ]; then
            echo "Colectare întreruptă. Descarcă progresul sau reia cu ID-ul acestei rulări." >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$status"
          fi
      - name: Salvează Excelul și progresul
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-next-fest-october-2026
          path: |
            output/steam_next_fest.xlsx
            output/steam_next_fest.sqlite3
          if-no-files-found: warn
          retention-days: 14
